
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="320" viewBox="0 0 900 320" fill="none" role="img" aria-labelledby="title desc">

<title id="title">Sarah Golabvand — Backend Developer</title> <desc id="desc"> A minimal technical hero interface presenting Sarah Golabvand as a Backend Developer and Systems Builder, with an animated backend lifecycle system. </desc> <defs> <!-- BACKGROUND --> <linearGradient id="panel-bg" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse"> <stop offset="0" stop-color="#0B1120"/> <stop offset="0.55" stop-color="#0D1526"/> <stop offset="1" stop-color="#0F172A"/> </linearGradient>
<radialGradient id="left-depth" cx="0" cy="0" r="1"
                gradientUnits="userSpaceOnUse"
                gradientTransform="translate(160 145) rotate(22) scale(340 230)">
  <stop stop-color="#1E293B" stop-opacity="0.30"/>
  <stop offset="1" stop-color="#1E293B" stop-opacity="0"/>
</radialGradient>

<radialGradient id="system-depth" cx="0" cy="0" r="1"
                gradientUnits="userSpaceOnUse"
                gradientTransform="translate(700 159) scale(225 190)">
  <stop stop-color="#0EA5E9" stop-opacity="0.10"/>
  <stop offset="0.56" stop-color="#38BDF8" stop-opacity="0.035"/>
  <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
</radialGradient>

<linearGradient id="accent-line" x1="82" y1="0" x2="432" y2="0" gradientUnits="userSpaceOnUse">
  <stop stop-color="#38BDF8"/>
  <stop offset="0.66" stop-color="#22D3EE"/>
  <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
</linearGradient>

<linearGradient id="core-fill" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#17243A"/>
  <stop offset="1" stop-color="#101B2E"/>
</linearGradient>

<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
  <path d="M24 0H0V24"
        stroke="#94A3B8"
        stroke-width="0.65"
        opacity="0.075"/>
</pattern>

<clipPath id="panel-clip">
  <rect x="10" y="10" width="880" height="300" rx="24"/>
</clipPath>

<filter id="tiny-glow"
        x="-150%"
        y="-150%"
        width="400%"
        height="400%"
        color-interpolation-filters="sRGB">
  <feGaussianBlur stdDeviation="2.2" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<style>
  .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  .identity-intro { opacity: 0; animation: identityReveal 1.05s cubic-bezier(.2,.7,.2,1) .12s forwards; }
  .identity-line { stroke-dasharray: 350; stroke-dashoffset: 350; animation: drawIdentity 1.35s cubic-bezier(.3,.7,.2,1) .5s forwards; }
  .orbit-motion { transform-origin: 700px 160px; animation: orbitRotate 28s linear infinite; }
  .pulse-primary { transform-box: fill-box; transform-origin: center; animation: nodePulse 4.8s ease-in-out infinite; }
  .pulse-secondary { transform-box: fill-box; transform-origin: center; animation: nodePulseSoft 6.4s ease-in-out 1.35s infinite; }
  .status-a { animation: statusFade 5.2s ease-in-out .4s infinite; }
  .status-b { animation: statusFade 6.1s ease-in-out 1.9s infinite; }
  .status-c { animation: statusFade 5.7s ease-in-out 3.1s infinite; }
  .scan-line { animation: scanMove 6.8s ease-in-out infinite; }
  .flow-highlight { stroke-dasharray: 4 118; stroke-dashoffset: 0; animation: routeFlow 7.2s linear infinite; }
  @keyframes identityReveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes drawIdentity { to { stroke-dashoffset: 0; } }
  @keyframes orbitRotate { to { transform: rotate(360deg); } }
  @keyframes nodePulse { 0%, 100% { opacity: .78; transform: scale(1); } 50% { opacity: 1; transform: scale(1.07); } }
  @keyframes nodePulseSoft { 0%, 100% { opacity: .58; transform: scale(1); } 50% { opacity: .9; transform: scale(1.045); } }
  @keyframes statusFade { 0%, 100% { opacity: .28; } 42% { opacity: .88; } 68% { opacity: .48; } }
  @keyframes scanMove { 0%, 12% { transform: translateY(-28px); opacity: 0; } 24% { opacity: .36; } 76% { opacity: .18; } 88%, 100% { transform: translateY(58px); opacity: 0; } }
  @keyframes routeFlow { to { stroke-dashoffset: -122; } }
  @media (prefers-reduced-motion: reduce) { .identity-intro, .identity-line, .orbit-motion, .pulse-primary, .pulse-secondary, .status-a, .status-b, .status-c, .scan-line, .flow-highlight { animation: none !important; } .identity-intro { opacity: 1; transform: none; } .identity-line { stroke-dashoffset: 0; } .signal-dot { display: none; } }
</style>
</defs> 

